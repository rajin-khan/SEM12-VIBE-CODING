[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gradgate"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
    "python-dotenv>=1.0",
    "supabase>=2.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3",
    "black>=24.0",
    "mypy>=1.9",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "supabase>=2.4",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
]
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "pdf2image>=1.17",
    "pypdf>=5.0",
]
load = [
    "locust>=2.24",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.setuptools]
packages = ["api"]
